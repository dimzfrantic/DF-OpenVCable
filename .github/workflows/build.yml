name: Build DF-OpenVCable Kernel Driver & Package

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-driver:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Windows Driver Kit (WDK)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Mengunduh dan memasang Windows Driver Kit (WDK) 22H2 dari Microsoft..."
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2196230', $installer)
          $process = Start-Process -FilePath $installer -ArgumentList '/features', '+', '/quiet', '/norestart' -Wait -PassThru
          Write-Host "WDK installer exit code: $($process.ExitCode)"
          
          # Salin MSBuild toolset dari WDK.vsix langsung ke direktori Visual Studio MSBuild
          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $vsix = Get-ChildItem "$kitsRoot\Vsix\VS2022\*\WDK.vsix" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if (-not $vsix) {
              $vsix = Get-ChildItem "$kitsRoot\Vsix\VS2022\WDK.vsix" -ErrorAction SilentlyContinue | Select-Object -Last 1
          }
          if ($vsix) {
              Write-Host "Mengekstrak integrasi MSBuild dari: $($vsix.FullName)"
              $vsixExtract = Join-Path $env:RUNNER_TEMP 'wdk-vsix'
              $vsixZip = Join-Path $env:RUNNER_TEMP 'wdk-vsix.zip'
              Copy-Item $vsix.FullName $vsixZip
              Expand-Archive $vsixZip -DestinationPath $vsixExtract -Force
              $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
              Copy-Item "$vsixExtract\`$MSBuild\*" "$vsPath\MSBuild" -Recurse -Force
              Write-Host "WDK MSBuild integration sukses dipasang!"
          } else {
              Write-Warning "WDK.vsix tidak ditemukan di $kitsRoot\Vsix"
          }

      - name: Detect Windows SDK Version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $includeRoot = Join-Path $kitsRoot "Include"
          $best = Get-ChildItem -Path $includeRoot -Directory -ErrorAction SilentlyContinue | 
                  Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | 
                  Where-Object { Test-Path (Join-Path $_.FullName "um\Windows.h") } | 
                  Sort-Object -Property Name -Descending | 
                  Select-Object -First 1
          if (-not $best) { throw "Windows 10/11 SDK tidak ditemukan di $includeRoot" }
          $sdkVersion = $best.Name
          Write-Host "Menggunakan SDK Version: $sdkVersion"
          "WINDOWS_SDK_DIR=$kitsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_TARGET_PLATFORM_VERSION=$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Driver (Release x64)
        shell: pwsh
        run: |
          Write-Host "=== Starting MSBuild Driver Build ==="
          $rawOutput = msbuild package\mcvad.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false /p:SignMode=Off /p:EnableInf2Cat=false /p:EnableInfVerif=false /v:normal 2>&1
          $exitCode = $LASTEXITCODE
          Write-Host "MSBuild finished with exit code: $exitCode"

          # Tampilkan seluruh output ke console runner
          $rawOutput | ForEach-Object { Write-Host $_ }

          # Simpan log ke file dan push ke branch ci-log
          try {
            $rawOutput | Out-File -FilePath "build_log.txt" -Encoding utf8
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ci-log
            git add -f build_log.txt
            git commit -m "Auto-commit build log [skip ci]"
            git push origin ci-log --force
            Write-Host "Successfully pushed build_log.txt to branch ci-log"
          } catch {
            Write-Warning "Could not push to branch ci-log: $_"
          }

          if ($exitCode -ne 0) {
            throw "MSBuild driver compilation failed with exit code $exitCode"
          }

      - name: Generate Driver Catalog (mcvad.cat) & Test Sign
        shell: pwsh
        run: |
          $diag = New-Object System.Collections.Generic.List[string]
          function Log([string]$m) { $diag.Add($m); Write-Host $m }

          # Cari tool WDK/SDK secara dinamis. Catatan penting: Inf2Cat.exe hanya
          # disediakan dalam varian x86 (managed tool), bukan x64, jadi pencarian
          # tidak boleh difilter ke folder x64.
          $binRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          function Find-KitTool([string]$name) {
              $all = Get-ChildItem -Path $binRoot -Filter $name -Recurse -ErrorAction SilentlyContinue
              if (-not $all) { return $null }
              $ranked = $all | Sort-Object -Property `
                  @{ Expression = { if ($_.FullName -match '\\bin\\(\d+\.\d+\.\d+\.\d+)\\') { [version]$matches[1] } else { [version]'0.0.0.0' } }; Descending = $true }, `
                  @{ Expression = { if ($_.FullName -match '\\x64\\') { 0 } else { 1 } } }
              return ($ranked | Select-Object -First 1).FullName
          }

          $Inf2Cat  = Find-KitTool "Inf2Cat.exe"
          $SignTool = Find-KitTool "signtool.exe"
          Log "Inf2Cat.exe  : $(if ($Inf2Cat) { $Inf2Cat } else { 'TIDAK DITEMUKAN' })"
          Log "signtool.exe : $(if ($SignTool) { $SignTool } else { 'TIDAK DITEMUKAN' })"

          if (-not $Inf2Cat) {
              Log "=== Inventaris Windows Kits\10\bin ==="
              Get-ChildItem $binRoot -Directory -ErrorAction SilentlyContinue |
                  ForEach-Object { Log ("  bin\" + $_.Name + "  -> " + ((Get-ChildItem $_.FullName -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', ')) }
              Log "=== Pencarian global inf2cat* ==="
              foreach ($root in @("C:\Program Files (x86)\Windows Kits", "C:\Program Files\Windows Kits", "C:\Program Files (x86)\Windows Kits\10\Tools")) {
                  if (Test-Path $root) {
                      $hits = Get-ChildItem $root -Filter "inf2cat*" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10
                      if ($hits) { $hits | ForEach-Object { Log ("  HIT: " + $_.FullName) } }
                      else { Log ("  tidak ada di " + $root) }
                  }
              }
          }

          # Salin binary mcvad.sys ke folder package
          Copy-Item package/x64/Release/mcvad.sys package/mcvad.sys -Force
          Log ("mcvad.sys size: " + (Get-Item package/mcvad.sys).Length + " bytes")

          # Buat sertifikat code signing lokal untuk CI build
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=MCVAD CI Test Certificate" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
          Export-Certificate -Cert $cert -FilePath package/MCVAD_TestCert.cer | Out-Null
          Log "Sertifikat test signing dibuat: $($cert.Thumbprint)"

          # Generate catalog via Inf2Cat
          if ($Inf2Cat) {
              Log "=== Inf2Cat output ==="
              $inf2catOut = & $Inf2Cat /driver:package /os:10_X64,Server10_X64 2>&1 | Out-String
              Log $inf2catOut
              Log "Inf2Cat exit code: $LASTEXITCODE"
          } else {
              Log "PERINGATAN: Inf2Cat.exe tidak ditemukan di seluruh $binRoot"
          }

          if (Test-Path package/mcvad.cat) {
              Log ("mcvad.cat berhasil dibuat: " + (Get-Item package/mcvad.cat).Length + " bytes")
          } else {
              Log "PERINGATAN: package/mcvad.cat TIDAK ADA setelah Inf2Cat."
          }

          # Sign mcvad.sys dan mcvad.cat via signtool.exe
          if ($SignTool) {
              Log "=== signtool mcvad.sys ==="
              Log (& $SignTool sign /v /fd SHA256 /s My /n "MCVAD CI Test Certificate" package/mcvad.sys 2>&1 | Out-String)
              Log "signtool sys exit code: $LASTEXITCODE"
              if (Test-Path package/mcvad.cat) {
                  Log "=== signtool mcvad.cat ==="
                  Log (& $SignTool sign /v /fd SHA256 /s My /n "MCVAD CI Test Certificate" package/mcvad.cat 2>&1 | Out-String)
                  Log "signtool cat exit code: $LASTEXITCODE"
              }
          } else {
              Log "PERINGATAN: signtool.exe tidak ditemukan di seluruh $binRoot"
          }

          # Publikasikan diagnostik ke branch ci-log (channel log yang sudah terbukti)
          try {
              $diag | Out-File -FilePath "catalog_log.txt" -Encoding utf8
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git checkout -B ci-log
              git add -f catalog_log.txt
              git commit -m "Auto-commit catalog diagnostics [skip ci]"
              git push origin ci-log --force
              Write-Host "Diagnostik katalog dipublikasikan ke branch ci-log"
          } catch {
              Write-Warning "Gagal mempublikasikan diagnostik katalog: $_"
          }

      - name: Build C++ Native Control Panel
        shell: pwsh
        run: |
          Set-Location control_panel
          & cl.exe /nologo /O2 /EHsc /W3 /D_UNICODE /DUNICODE control_panel.cpp /Fe:control_panel.exe /link user32.lib gdi32.lib comctl32.lib dwmapi.lib uxtheme.lib /SUBSYSTEM:WINDOWS
          if ($LASTEXITCODE -ne 0) {
              throw "Control Panel compilation failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path "control_panel.exe")) {
              throw "control_panel.exe was not created!"
          }
          Write-Host "Control panel successfully built: control_panel.exe"

      - name: Build GUI Installer & Watermark Tool
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
              $cscCmd = Get-Command csc.exe -ErrorAction SilentlyContinue
              if ($cscCmd) { $csc = $cscCmd.Source }
          }
          if (-not $csc -or -not (Test-Path $csc)) {
              throw "Kompiler C# bawaan Windows (csc.exe) tidak ditemukan!"
          }
          Write-Host "Menggunakan C# Compiler: $csc"

          Write-Host "[1/2] Mengompilasi DF-OpenVCable Setup GUI..."
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /out:installer\DF-OpenVCable_Setup.exe installer\Installer.cs
          if ($LASTEXITCODE -ne 0) { throw "Gagal mengompilasi installer/Installer.cs" }
          Copy-Item installer\DF-OpenVCable_Setup.exe installer\DF-OpenVCable-Setup.exe -Force
          Write-Host "OK: installer/DF-OpenVCable_Setup.exe"

          Write-Host "[2/2] Mengompilasi Watermark Remover Tool..."
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /out:tools\Remove-Watermark.exe tools\WatermarkPatcher.cs
          if ($LASTEXITCODE -ne 0) { throw "Gagal mengompilasi tools/WatermarkPatcher.cs" }
          Write-Host "OK: tools/Remove-Watermark.exe"

      - name: Lint PowerShell Scripts
        shell: pwsh
        run: |
          $failed = 0
          $files = Get-ChildItem -Path tests, package -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue
          foreach ($f in $files) {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
              if ($errors -and $errors.Count -gt 0) {
                  $failed++
                  Write-Host "SYNTAX ERROR di $($f.Name):"
                  $errors | ForEach-Object { Write-Host ("  baris {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
              } else {
                  Write-Host "OK  $($f.Name)"
              }
          }
          if ($failed -gt 0) { throw "$failed skrip PowerShell gagal parse" }
          Write-Host "Semua skrip PowerShell valid ($($files.Count) file)."

      - name: Package Release Bundle
        shell: pwsh
        run: |
          $pkg = "release/DF-OpenVCable-v1.0.0-x64"
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkg/Driver" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkg/Tools" -Force | Out-Null

          # 1. Main Setup & Control Panel
          Copy-Item installer/DF-OpenVCable_Setup.exe $pkg/ -Force
          Copy-Item control_panel/control_panel.exe $pkg/ -Force -ErrorAction SilentlyContinue
          Copy-Item control_panel/mcvad_control_panel.py $pkg/ -Force
          Copy-Item README.md $pkg/ -Force -ErrorAction SilentlyContinue

          # 2. Driver Components (ke Driver/ dan root untuk kompatibilitas)
          $driverFiles = @(
              "mcvad.sys", "mcvad.inf", "mcvad.cat", "MCVAD_TestCert.cer",
              "install.bat", "uninstall.bat", "create_device.ps1", "setup_cert.bat",
              "repair.bat", "update_driver.bat", "reload_driver.bat", "enable_device.bat"
          )
          foreach ($f in $driverFiles) {
              $src = "package/$f"
              if (Test-Path $src) {
                  Copy-Item $src "$pkg/Driver/" -Force
                  Copy-Item $src "$pkg/" -Force
              }
          }

          # 3. Tools Components
          Copy-Item tools/Remove-Watermark.exe "$pkg/Tools/" -Force

          # 4. Harness validasi & panduan
          New-Item -ItemType Directory -Path "$pkg/tests" -Force | Out-Null
          New-Item -ItemType Directory -Path "$pkg/docs" -Force | Out-Null
          Copy-Item tests/mcvad_selftest.ps1 $pkg/tests/ -Force
          Copy-Item tests/audio_loopback.ps1 $pkg/tests/ -Force
          Copy-Item tests/diagnose_startdevice.ps1 $pkg/tests/ -Force
          Copy-Item docs/VALIDATION.md $pkg/docs/ -Force

          # Verifikasi isi paket sebelum dikemas (fail-fast jika artefak utama hilang)
          $required = @(
              "DF-OpenVCable_Setup.exe",
              "control_panel.exe",
              "mcvad.sys",
              "mcvad.inf",
              "mcvad.cat",
              "MCVAD_TestCert.cer",
              "Driver/mcvad.sys",
              "Driver/mcvad.inf",
              "Tools/Remove-Watermark.exe",
              "tests/mcvad_selftest.ps1",
              "tests/audio_loopback.ps1",
              "docs/VALIDATION.md"
          )
          foreach ($f in $required) {
              if (-not (Test-Path (Join-Path $pkg $f))) {
                  throw "Paket tidak lengkap: '$f' tidak ditemukan di $pkg"
              }
          }
          Write-Host "Isi paket release:"
          Get-ChildItem $pkg -Recurse | ForEach-Object {
              if (-not $_.PSIsContainer) {
                  Write-Host ("  {0,-40} {1,10} bytes" -f $_.FullName.Substring((Resolve-Path $pkg).Path.Length + 1), $_.Length)
              }
          }

          $zip = "release/DF-OpenVCable-v1.0.0-x64.zip"
          Compress-Archive -Path "$pkg/*" -DestinationPath $zip -Force
          Write-Host "Release zip package created at $zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DF-OpenVCable-v1.0.0-x64-Package
          path: release/DF-OpenVCable-v1.0.0-x64.zip

      - name: Publish Rolling Release (downloadable tanpa login)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: DF-OpenVCable - Latest CI Build
          body: |
            Build otomatis dari branch `main` (commit ${{ github.sha }}).

            Paket All-in-One v1.0.0 (x64):
            - **DF-OpenVCable_Setup.exe**: One-Click GUI Setup & Driver Manager (Administrator).
            - **Driver (mcvad.sys)**: 5 pasang Virtual Audio Cable (Line 1 s.d. Line D) ultra-low latency.
            - **Control Panel (control_panel.exe)**: Native monitor buffer & konfigurasi sample rate audio.
            - **Tools (Remove-Watermark.exe)**: Utilitas pembersih watermark Windows Test Mode.
          prerelease: true
          overwrite_files: true
          files: release/DF-OpenVCable-v1.0.0-x64.zip
