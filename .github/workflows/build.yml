name: Build MCVAD Kernel Driver & Package

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-driver:
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Windows Driver Kit (WDK)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Mengunduh dan memasang Windows Driver Kit (WDK) 22H2 dari Microsoft..."
          $installer = Join-Path $env:RUNNER_TEMP 'wdksetup.exe'
          (New-Object Net.WebClient).DownloadFile('https://go.microsoft.com/fwlink/?linkid=2196230', $installer)
          $process = Start-Process -FilePath $installer -ArgumentList '/features', '+', '/quiet', '/norestart' -Wait -PassThru
          Write-Host "WDK installer exit code: $($process.ExitCode)"
          
          # Salin MSBuild toolset dari WDK.vsix langsung ke direktori Visual Studio MSBuild
          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $vsix = Get-ChildItem "$kitsRoot\Vsix\VS2022\*\WDK.vsix" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if (-not $vsix) {
              $vsix = Get-ChildItem "$kitsRoot\Vsix\VS2022\WDK.vsix" -ErrorAction SilentlyContinue | Select-Object -Last 1
          }
          if ($vsix) {
              Write-Host "Mengekstrak integrasi MSBuild dari: $($vsix.FullName)"
              $vsixExtract = Join-Path $env:RUNNER_TEMP 'wdk-vsix'
              $vsixZip = Join-Path $env:RUNNER_TEMP 'wdk-vsix.zip'
              Copy-Item $vsix.FullName $vsixZip
              Expand-Archive $vsixZip -DestinationPath $vsixExtract -Force
              $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
              Copy-Item "$vsixExtract\`$MSBuild\*" "$vsPath\MSBuild" -Recurse -Force
              Write-Host "WDK MSBuild integration sukses dipasang!"
          } else {
              Write-Warning "WDK.vsix tidak ditemukan di $kitsRoot\Vsix"
          }

      - name: Detect Windows SDK Version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $includeRoot = Join-Path $kitsRoot "Include"
          $best = Get-ChildItem -Path $includeRoot -Directory -ErrorAction SilentlyContinue | 
                  Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | 
                  Where-Object { Test-Path (Join-Path $_.FullName "um\Windows.h") } | 
                  Sort-Object -Property Name -Descending | 
                  Select-Object -First 1
          if (-not $best) { throw "Windows 10/11 SDK tidak ditemukan di $includeRoot" }
          $sdkVersion = $best.Name
          Write-Host "Menggunakan SDK Version: $sdkVersion"
          "WINDOWS_SDK_DIR=$kitsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_TARGET_PLATFORM_VERSION=$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Driver (Release x64)
        shell: pwsh
        run: |
          Write-Host "=== Starting MSBuild Driver Build ==="
          $rawOutput = msbuild package\mcvad.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SpectreMitigation=false /p:SignMode=Off /p:EnableInf2Cat=false /p:EnableInfVerif=false /v:normal 2>&1
          $exitCode = $LASTEXITCODE
          Write-Host "MSBuild finished with exit code: $exitCode"

          # Tampilkan seluruh output ke console runner
          $rawOutput | ForEach-Object { Write-Host $_ }

          # Render ke GITHUB_STEP_SUMMARY (publik & tanpa login)
          "### MSBuild Driver Compilation Output (Exit Code: $exitCode)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "```text" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $rawOutput | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "```" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          if ($exitCode -ne 0) {
            throw "MSBuild driver compilation failed with exit code $exitCode"
          }

      - name: Generate Driver Catalog (mcvad.cat) & Test Sign
        shell: pwsh
        run: |
          $KitBin = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64"
          if (-not (Test-Path $KitBin)) {
              $KitBin = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64" -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          }
          Write-Host "Menggunakan Windows Kit tools dari: $KitBin"
          
          # Salin binary mcvad.sys ke folder package
          Copy-Item package/x64/Release/mcvad.sys package/mcvad.sys -Force
          
          # Buat sertifikat code signing lokal untuk CI build
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=MCVAD CI Test Certificate" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(5)
          Export-Certificate -Cert $cert -FilePath package/MCVAD_TestCert.cer | Out-Null
          
          # Generate catalog via Inf2Cat jika tersedia
          $Inf2Cat = Join-Path $KitBin "Inf2Cat.exe"
          if (Test-Path $Inf2Cat) {
              & $Inf2Cat /driver:package /os:10_X64,Server10_X64
          }
          
          # Sign mcvad.sys dan mcvad.cat via signtool.exe
          $SignTool = Join-Path $KitBin "signtool.exe"
          if (Test-Path $SignTool) {
              & $SignTool sign /v /fd SHA256 /s My /n "MCVAD CI Test Certificate" package/mcvad.sys
              if (Test-Path package/mcvad.cat) {
                  & $SignTool sign /v /fd SHA256 /s My /n "MCVAD CI Test Certificate" package/mcvad.cat
              }
          }
          Write-Host "Driver successfully built and signed!"

      - name: Build C++ Native Control Panel
        shell: cmd
        run: |
          cd control_panel
          call build.bat --ci

      - name: Package Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release/MCVAD-Release-x64 -Force | Out-Null
          Copy-Item package/mcvad.sys release/MCVAD-Release-x64/ -Force -ErrorAction SilentlyContinue
          Copy-Item package/mcvad.inf release/MCVAD-Release-x64/ -Force
          Copy-Item package/mcvad.cat release/MCVAD-Release-x64/ -Force -ErrorAction SilentlyContinue
          Copy-Item package/MCVAD_TestCert.cer release/MCVAD-Release-x64/ -Force -ErrorAction SilentlyContinue
          Copy-Item package/install.bat release/MCVAD-Release-x64/ -Force
          Copy-Item package/uninstall.bat release/MCVAD-Release-x64/ -Force
          Copy-Item package/create_device.ps1 release/MCVAD-Release-x64/ -Force
          Copy-Item package/setup_cert.bat release/MCVAD-Release-x64/ -Force
          Copy-Item control_panel/control_panel.exe release/MCVAD-Release-x64/ -Force -ErrorAction SilentlyContinue
          Copy-Item control_panel/mcvad_control_panel.py release/MCVAD-Release-x64/ -Force
          Copy-Item README.md release/MCVAD-Release-x64/ -Force -ErrorAction SilentlyContinue
          
          Compress-Archive -Path release/MCVAD-Release-x64/* -DestinationPath release/MCVAD-v1.2.0-x64.zip -Force
          Write-Host "Release zip package created at release/MCVAD-v1.2.0-x64.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCVAD-v1.2.0-x64-Package
          path: release/MCVAD-v1.2.0-x64.zip
